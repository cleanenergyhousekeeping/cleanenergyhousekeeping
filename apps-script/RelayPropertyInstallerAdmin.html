<!doctype html>
<html>
  <head>
    <base target="_top">
    <style>
      /* begin[production_relay_property_installer_dialog_styles] */
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        font-size: 14px;
        color: #202124;
      }

      body {
        margin: 0;
        padding: 24px;
        background: #fff;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 20px;
        line-height: 1.3;
      }

      p {
        margin: 0 0 16px;
        line-height: 1.5;
      }

      .warning {
        padding: 12px;
        border: 1px solid #f9ab00;
        border-radius: 6px;
        background: #fef7e0;
      }

      label {
        display: block;
        margin: 18px 0 6px;
        font-weight: 600;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        padding: 10px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      input:focus {
        border-color: #1a73e8;
        outline: 2px solid #d2e3fc;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 22px;
      }

      button {
        min-width: 90px;
        padding: 9px 14px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        background: #fff;
        color: #1a73e8;
        font-weight: 600;
        cursor: pointer;
      }

      button.primary {
        border-color: #1a73e8;
        background: #1a73e8;
        color: #fff;
      }

      button:disabled {
        cursor: default;
        opacity: 0.55;
      }

      #status {
        margin-top: 20px;
        padding: 12px;
        border-radius: 6px;
        background: #f1f3f4;
        line-height: 1.5;
      }

      #status:empty {
        display: none;
      }

      .status-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }

      .status-label {
        font-weight: 600;
      }
      /* end[production_relay_property_installer_dialog_styles] */
    </style>
  </head>
  <body>
    <!-- begin[production_relay_property_installer_dialog] -->
    <h1>Production relay properties</h1>
    <p class="warning">
      Owner operation only. Use the reviewed clipboard helper to paste the two
      values. The installer preserves existing properties and forces the relay
      to remain disabled.
    </p>

    <form id="installerForm" autocomplete="off">
      <label for="hmacKeysJson">CEH_RELAY_HMAC_KEYS_JSON</label>
      <input
        id="hmacKeysJson"
        type="password"
        autocomplete="new-password"
        autocapitalize="none"
        spellcheck="false"
        required
      >

      <label for="subjectHmacKey">CEH_RELAY_SUBJECT_HMAC_KEY</label>
      <input
        id="subjectHmacKey"
        type="password"
        autocomplete="new-password"
        autocapitalize="none"
        spellcheck="false"
        required
      >

      <div class="actions">
        <button id="cancelButton" type="button">Cancel</button>
        <button id="installButton" class="primary" type="submit">
          Install disabled
        </button>
      </div>
    </form>

    <div id="status" role="status" aria-live="polite"></div>

    <script>
      /* begin[production_relay_property_installer_dialog_client] */
      const form = document.getElementById("installerForm");
      const hmacKeysInput = document.getElementById("hmacKeysJson");
      const subjectKeyInput = document.getElementById("subjectHmacKey");
      const installButton = document.getElementById("installButton");
      const cancelButton = document.getElementById("cancelButton");
      const status = document.getElementById("status");

      function clearSecretFields() {
        form.reset();
        hmacKeysInput.value = "";
        subjectKeyInput.value = "";
      }

      function setBusy(isBusy) {
        installButton.disabled = isBusy;
        cancelButton.disabled = isBusy;
      }

      function appendStatusRow(label, value) {
        const row = document.createElement("div");
        const labelElement = document.createElement("span");
        const valueElement = document.createElement("span");
        row.className = "status-row";
        labelElement.className = "status-label";
        labelElement.textContent = label;
        valueElement.textContent = value;
        row.append(labelElement, valueElement);
        status.append(row);
      }

      function showFailure() {
        setBusy(false);
        status.replaceChildren();
        status.textContent =
          "Installation failed. No secret values were displayed.";
      }

      function showVerification(result) {
        setBusy(false);
        status.replaceChildren();
        appendStatusRow("Installation", "successful");
        appendStatusRow("Relay", result.relayEnabledStatus);
        appendStatusRow(
          "Missing properties",
          result.missingPropertyNames.length === 0
            ? "none"
            : result.missingPropertyNames.join(", ")
        );
        appendStatusRow(
          "Signing key ring",
          result.signingRingStructurallyValid &&
            result.productionKeyIdPresent &&
            result.signingKeyLengthValid
            ? "valid"
            : "invalid"
        );
        appendStatusRow(
          "Subject HMAC key",
          result.subjectKeyLengthValid ? "valid" : "invalid"
        );
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        let hmacKeysJson = hmacKeysInput.value;
        let subjectHmacKey = subjectKeyInput.value;
        if (!hmacKeysJson || !subjectHmacKey) {
          showFailure();
          clearSecretFields();
          hmacKeysJson = "";
          subjectHmacKey = "";
          return;
        }

        setBusy(true);
        status.replaceChildren();
        status.textContent = "Installing and verifying…";
        try {
          google.script.run
            .withSuccessHandler(showVerification)
            .withFailureHandler(showFailure)
            .installProductionRelayPropertiesAdmin(hmacKeysJson, subjectHmacKey);
        } catch (_) {
          showFailure();
        } finally {
          clearSecretFields();
          hmacKeysJson = "";
          subjectHmacKey = "";
        }
      });

      cancelButton.addEventListener("click", function () {
        clearSecretFields();
        google.script.host.close();
      });

      window.addEventListener("pagehide", clearSecretFields);
      /* end[production_relay_property_installer_dialog_client] */
    </script>
    <!-- end[production_relay_property_installer_dialog] -->
  </body>
</html>
