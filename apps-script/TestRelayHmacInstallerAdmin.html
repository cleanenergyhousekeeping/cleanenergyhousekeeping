<!doctype html>
<html>
  <head>
    <base target="_top">
    <style>
      /* begin[test_relay_hmac_installer_dialog_styles] */
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        font-size: 14px;
        color: #202124;
      }

      body {
        margin: 0;
        padding: 24px;
        background: #fff;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 20px;
        line-height: 1.3;
      }

      p {
        margin: 0 0 16px;
        line-height: 1.5;
      }

      .warning {
        padding: 12px;
        border: 1px solid #f9ab00;
        border-radius: 6px;
        background: #fef7e0;
      }

      label {
        display: block;
        margin: 18px 0 6px;
        font-weight: 600;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        padding: 10px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      input:focus {
        border-color: #1a73e8;
        outline: 2px solid #d2e3fc;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 22px;
      }

      button {
        min-width: 90px;
        padding: 9px 14px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        background: #fff;
        color: #1a73e8;
        font-weight: 600;
        cursor: pointer;
      }

      button.primary {
        border-color: #1a73e8;
        background: #1a73e8;
        color: #fff;
      }

      button:disabled {
        cursor: default;
        opacity: 0.55;
      }

      #status {
        margin-top: 20px;
        padding: 12px;
        border-radius: 6px;
        background: #f1f3f4;
        line-height: 1.5;
      }

      #status:empty {
        display: none;
      }
      /* end[test_relay_hmac_installer_dialog_styles] */
    </style>
  </head>
  <body>
    <!-- begin[test_relay_hmac_installer_dialog] -->
    <h1>TEST relay signing ring</h1>
    <p class="warning">
      Owner operation only. Paste the reviewed TEST signing-ring JSON. This
      helper writes only CEH_RELAY_HMAC_KEYS_JSON and preserves other properties.
    </p>

    <form id="installerForm" autocomplete="off">
      <label for="hmacKeysJson">CEH_RELAY_HMAC_KEYS_JSON</label>
      <input
        id="hmacKeysJson"
        type="password"
        autocomplete="new-password"
        autocapitalize="none"
        spellcheck="false"
        required
      >

      <div class="actions">
        <button id="cancelButton" type="button">Cancel</button>
        <button id="installButton" class="primary" type="submit">
          Install TEST ring
        </button>
      </div>
    </form>

    <div id="status" role="status" aria-live="polite"></div>

    <script>
      /* begin[test_relay_hmac_installer_dialog_client] */
      const form = document.getElementById("installerForm");
      const hmacKeysInput = document.getElementById("hmacKeysJson");
      const installButton = document.getElementById("installButton");
      const cancelButton = document.getElementById("cancelButton");
      const status = document.getElementById("status");

      function clearSecretField() {
        form.reset();
        hmacKeysInput.value = "";
      }

      function setBusy(isBusy) {
        installButton.disabled = isBusy;
        cancelButton.disabled = isBusy;
      }

      function showFailure() {
        setBusy(false);
        status.textContent =
          "Installation failed. No secret values were displayed.";
      }

      function showResult(result) {
        setBusy(false);
        if (!result || result.ok !== true || result.result !== "installed") {
          showFailure();
          return;
        }
        status.textContent = "TEST signing ring installed.";
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        let hmacKeysJson = hmacKeysInput.value;
        if (!hmacKeysJson) {
          showFailure();
          clearSecretField();
          hmacKeysJson = "";
          return;
        }

        setBusy(true);
        status.textContent = "Installing and validating…";
        try {
          google.script.run
            .withSuccessHandler(showResult)
            .withFailureHandler(showFailure)
            .installTestRelayHmacKeysAdmin(hmacKeysJson);
        } catch (_) {
          showFailure();
        } finally {
          clearSecretField();
          hmacKeysJson = "";
        }
      });

      cancelButton.addEventListener("click", function () {
        clearSecretField();
        google.script.host.close();
      });

      window.addEventListener("pagehide", clearSecretField);
      /* end[test_relay_hmac_installer_dialog_client] */
    </script>
    <!-- end[test_relay_hmac_installer_dialog] -->
  </body>
</html>
